name: Docs

# Publish on a push that touches the site, and keep the manual trigger for
# re-deploying without a docs change.
on:
  push:
    branches: [main]
    paths: ["www/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Configure the repository's Pages source as GitHub Actions in Settings.
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: www/package-lock.json
      - name: Install
        working-directory: www
        run: npm ci
      - name: Build
        working-directory: www
        run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
