# Companion stack for an existing, separately deployed Home Assistant (no Supervisor).
# Mirrors "Standalone Docker" in www/docs/guide/unattended-renewal.md.
# Portainer: Stacks > Add stack > Web editor (every build is a git URL, so this file can live anywhere).
#
# Variables: XPENG_EMAIL, XPENG_PASSWORD (a dedicated account, never the phone-app one),
# SOLVER_TOKEN, RENEW_TOKEN, HA_URL (e.g. http://192.168.1.10:8123), HA_TOKEN (admin
# long-lived token), NAS_IP (TrueNAS).
#
# Home Assistant (separate VM) must read the same files: add the xpeng-credentials NFS
# export as network storage named "xpeng" (Usage: Share) -> /share/xpeng. Core reads the
# pair itself. Put the .pem files in the xpeng-client-certs dataset.
services:
  xpeng-slider-solver:
    build: https://github.com/xpengtoolkit/slider-solver.git#:slider_solver
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      SOLVER_TOKEN: ${SOLVER_TOKEN:?set SOLVER_TOKEN}

  xpeng-renew:
    build: https://github.com/ChristophWeigert/xpengtoolkit.git#slim-renew-image:xpeng_renew
    restart: unless-stopped
    depends_on: [xpeng-slider-solver]
    ports: ["8090:8090"] # POST /renew, GET /healthz
    environment:
      EMAIL: ${XPENG_EMAIL:?set XPENG_EMAIL}
      PASSWORD: ${XPENG_PASSWORD:?set XPENG_PASSWORD}
      SOLVER_URL: http://xpeng-slider-solver:8080
      SOLVER_TOKEN: ${SOLVER_TOKEN}
      RENEW_TOKEN: ${RENEW_TOKEN:-}
      PAIR_DIR: /share/xpeng # must equal the path Home Assistant sees
      CORE_API: ${HA_URL:?set HA_URL}/api
      SUPERVISOR_TOKEN: ${HA_TOKEN:?set HA_TOKEN} # just the bearer; the name is the app's
      COMMAND_MODE: ${COMMAND_MODE:-safe_plus}
    volumes:
      - xpeng-credentials:/share/xpeng
      - xpeng-client-certs:/config/xpeng-certs:ro
      - xpeng-renew-state:/data # device_id.txt: a remembered identity outlasts a fresh one

volumes:
  xpeng-renew-state:
  # NFS datasets on TrueNAS; Home Assistant mounts xpeng-credentials as network storage
  # "xpeng" (Usage: Share) so it sees the same files at /share/xpeng.
  xpeng-credentials:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_IP:?set NAS_IP},nfsvers=4,rw
      device: ":/mnt/pool-main/xpeng-credentials"
  xpeng-client-certs:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_IP},nfsvers=4,ro
      device: ":/mnt/pool-main/xpeng-client-certs"
