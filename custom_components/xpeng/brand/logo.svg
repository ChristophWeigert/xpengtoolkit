<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="512" height="256">
  <!-- Mark plus wordmark. Landscape 2:1, so the shortest side is 256 - the largest the
       Home Assistant brand specification allows for the normal logo. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12A4B4"/><stop offset="1" stop-color="#1668B0"/>
    </linearGradient>
    <clipPath id="rounded"><rect x="0" y="0" width="176" height="176" rx="40" ry="40"/></clipPath>
  </defs>
  <g transform="translate(28, 40)">
    <g clip-path="url(#rounded)">
      <rect x="0" y="0" width="176" height="176" fill="url(#tile)"/>
    <!-- the project's initial, as in icon.svg -->
    <g stroke="#FFFFFF" stroke-width="23" stroke-linecap="round" opacity="0.18">
      <line x1="14" y1="14" x2="162" y2="162"/>
      <line x1="162" y1="14" x2="14" y2="162"/>
    </g>
      <path d="M26 118 L34 95 C38 86 53 78 69 76 L107 76 C123 78 138 86 143 95 L150 118
               C151 121 149 124 145 124 L32 124 C28 124 25 121 26 118 Z" fill="#FFFFFF"/>
      <circle cx="54" cy="125" r="13" fill="url(#tile)"/>
      <circle cx="122" cy="125" r="13" fill="url(#tile)"/>
      <circle cx="54" cy="125" r="5.5" fill="#FFFFFF"/>
      <circle cx="122" cy="125" r="5.5" fill="#FFFFFF"/>
      <path d="M94 79 L78 104 L89 104 L84 121 L103 94 L92 94 Z" fill="url(#tile)"/>
    </g>
  </g>
  <text x="232" y="118" font-family="Helvetica, Arial, sans-serif" font-size="58"
        font-weight="600" fill="#1B2A33">Xpengtk</text>
  <text x="234" y="152" font-family="Helvetica, Arial, sans-serif" font-size="22"
        fill="#5A6B75">XPENG for Home Assistant</text>
</svg>
